[package]
name = "gorillas-bas-rs"
version = "0.1.0"
edition = "2021"
description = "Behaviorally-faithful terminal port of QBasic GORILLAS (Deluxe) with subcell rendering and a configurable AI opponent"

[[bin]]
name = "gorillas"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"

[profile.release]
opt-level = 3
lto = true
